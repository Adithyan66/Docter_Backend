version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: doctor-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: doctor
    volumes:
      - mongodb_data:/data/db
    networks:
      - doctor-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/doctor --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doctor-backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/doctor
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-gcp}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GCP_BUCKET_NAME: ${GCP_BUCKET_NAME}
      GCP_KEY_FILENAME: ${GCP_KEY_FILENAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      ALLOWED_IMAGE_TYPES: ${ALLOWED_IMAGE_TYPES:-image/jpeg,image/png,image/jpg,image/webp}
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - doctor-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  doctor-network:
    driver: bridge


